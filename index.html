<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sport Santé Bien Être – Espace Éducateur</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --magenta: #8D1F5B;
            --magenta-light: #b5276f;
            --magenta-dark: #6a1644;
            --white: #ffffff;
            --bg: #f4f1f5;
            --text: #1e1e2e;
            --card: #ffffff;
            --shadow: 0 8px 32px rgba(141,31,91,0.13);
            --radius: 22px;
            --vert: #27ae60;
            --bleu: #2980b9;
            --jaune: #e6ac00;
            --orange: #e67e22;
            --rouge: #c0392b;
            --violet: #7d3c98;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        header {
            background: var(--white);
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 76px;
            box-shadow: 0 2px 16px rgba(141,31,91,0.10);
            flex-shrink: 0;
            z-index: 10;
        }
        .logo-img { height: 52px; width: auto; }
        .header-center h1 {
            font-size: 1rem;
            font-weight: 900;
            color: var(--magenta);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .header-center p {
            font-size: 0.72rem;
            color: #999;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* ── ÉCRAN CHOIX PUBLIC ── */
        #screen-public {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 40px;
            background: linear-gradient(145deg, #f9f5f8 0%, #f0e8f0 100%);
        }
        #screen-public h2 {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--magenta);
        }
        .public-cards {
            display: flex;
            gap: 28px;
        }
        .btn-public {
            background: var(--white);
            border: none;
            border-radius: 28px;
            width: 200px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(141,31,91,0.15);
            transition: transform 0.18s, box-shadow 0.18s;
            font-family: 'Montserrat', sans-serif;
        }
        .btn-public:hover { transform: translateY(-6px); box-shadow: 0 16px 48px rgba(141,31,91,0.22); }
        .btn-public:active { transform: translateY(-2px); }
        .btn-public .icon { font-size: 3.2rem; }
        .btn-public .label {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--magenta);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .btn-public .sublabel {
            font-size: 0.72rem;
            color: #aaa;
            font-weight: 600;
        }

        /* ── INTERFACE JEU ── */
        #screen-game {
            flex: 1;
            display: none;
            padding: 18px 20px;
            gap: 18px;
            overflow: hidden;
        }
        #screen-game.active { display: flex; }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 210px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .public-badge {
            background: var(--magenta);
            color: var(--magenta);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
        }
        .cat-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }
        .cat-item {
            background: var(--white);
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 2.5px solid transparent;
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        .cat-item:hover { transform: translateX(4px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
        .cat-item.active { border-color: var(--magenta); box-shadow: 0 4px 16px rgba(141,31,91,0.18); }
        .cat-circle {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .cat-name {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }
        .btn-change {
            background: none;
            border: 2px solid var(--magenta);
            color: var(--magenta);
            border-radius: 12px;
            padding: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: background 0.15s, color 0.15s;
        }
        .btn-change:hover { background: var(--magenta); color: white; }

        /* ── ZONE QUESTION ── */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }

        .progress-bar-wrap {
            height: 6px;
            background: #e8dded;
            border-radius: 99px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--magenta);
            border-radius: 99px;
            transition: width 0.4s ease;
        }

        .q-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .q-cat-label {
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--magenta);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .q-counter {
            font-size: 0.7rem;
            font-weight: 700;
            color: #aaa;
        }

        .q-card {
            flex: 1;
            background: var(--white);
            border-radius: var(--radius);
            padding: 28px 32px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            box-shadow: var(--shadow);
            overflow-y: auto;
        }
        .q-inner {
            width: 100%;
        }
        .q-question {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--magenta);
            line-height: 1.5;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0e0ea;
        }
        .q-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .q-option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.45;
        }
        .q-badge {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--magenta);
            color: white;
            font-size: 0.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1px;
        }
        .q-text {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text);
            text-align: center;
            line-height: 1.65;
            white-space: pre-line;
        }
        .q-placeholder {
            font-size: 1rem;
            font-weight: 600;
            color: #ccc;
            text-align: center;
            width: 100%;
        }

        .a-card {
    background: #fdf2f7;
    border-left: 6px solid var(--magenta);
    border-radius: var(--radius);
    padding: 18px 24px;
    display: none;
    flex-direction: column;
    gap: 8px;
    animation: slideIn 0.25s ease;
}
.a-answer {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--magenta);
}
.a-explain {
    font-size: 0.88rem;
    font-weight: 500;
    color: #666;
    font-style: italic;
    border-top: 1px solid #e8c5d8;
    padding-top: 8px;
    line-height: 1.5;
}
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .btn-action {
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: opacity 0.15s, transform 0.12s;
            display: none;
        }
        .btn-action:active { transform: scale(0.97); }
        .btn-action.green  { background: #27ae60; color: white; }
        .btn-action.purple { background: var(--magenta); color: white; }
        .btn-action.dark   { background: #34495e; color: white; }

        /* ── COULEURS CATÉGORIES ── */
        .c-vert   { background-color: #27ae60; }
        .c-rouge  { background-color: #c0392b; }
        .c-bleu   { background-color: #2980b9; }
        .c-jaune  { background-color: #e6ac00; }
        .c-violet { background-color: #7d3c98; }
        .c-orange { background-color: #e67e22; }
    </style>
</head>

// ═══════════════════════════════════════════════════════════
//  LOGIQUE APP
// ═══════════════════════════════════════════════════════════
let currentCat    = null;
let shuffledQ     = [];
let currentIdx    = 0;
let activePublic  = null;

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function startApp(pub) {
    activePublic = pub;
    document.getElementById('screen-public').style.display = 'none';
    const game = document.getElementById('screen-game');
    game.style.display = 'flex';
    game.classList.add('active');

    document.getElementById('public-badge').textContent =
        pub === 'adulte' ? 'Ado / Adulte' : 'Enfant';

    const list = document.getElementById('cat-list');
    list.innerHTML = '';
    data[pub].forEach(cat => {
        const div = document.createElement('div');
        div.className = 'cat-item';
        div.dataset.name = cat.n;
        div.onclick = () => selectCategory(cat, div);
        div.innerHTML = `<div class="cat-circle ${cat.c}">${cat.e}</div><span class="cat-name">${cat.n}</span>`;
        list.appendChild(div);
    });
}

function selectCategory(cat, el) {
    // highlight actif
    document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');

    currentCat  = cat;
    shuffledQ   = shuffle(cat.questions);
    currentIdx  = 0;
    showQuestion();
}

function showQuestion() {
    const item = shuffledQ[currentIdx];
    const total = shuffledQ.length;

    document.getElementById('q-cat-label').textContent = currentCat.n.toUpperCase();
    document.getElementById('q-counter').textContent   = `${currentIdx + 1} / ${total}`;
    document.getElementById('progress-bar').style.width = `${((currentIdx) / total) * 100}%`;

    const qEl = document.getElementById('q-text');

    // Parse question: first line = question text, rest = options
    const lines = item.q.split('\n').filter(l => l.trim() !== '');
    const questionText = lines[0];
    const options = lines.slice(1);

    // Build structured HTML
    let optionsHTML = '';
    const badgeLetters = ['A', 'B', 'C', 'D', 'E'];
    options.forEach((opt, i) => {
        // Remove leading "A. " "B. " etc if present
        const cleanOpt = opt.replace(/^[A-E]\.\s*/, '');
        const letter = badgeLetters[i] || String.fromCharCode(65 + i);
        optionsHTML += `<div class="q-option"><span class="q-badge">${letter}</span><span>${cleanOpt}</span></div>`;
    });

    if (options.length > 0) {
        qEl.parentElement.innerHTML = `
            <div class="q-inner">
                <div class="q-question" id="q-text">${questionText}</div>
                <div class="q-options">${optionsHTML}</div>
            </div>`;
    } else {
        qEl.parentElement.innerHTML = `<div class="q-inner"><p class="q-text" id="q-text">${item.q}</p></div>`;
    }

    const aEl = document.getElementById('a-text');
    const rData = item.r;
if (typeof rData === 'object' && rData.r) {
    aEl.innerHTML = `<div class="a-answer">✅ ${rData.r}</div>${rData.e ? `<div class="a-explain">💡 ${rData.e}</div>` : ''}`;
} else {
    aEl.innerHTML = `<div class="a-answer">✅ ${rData}</div>`;
}
aEl.style.display = 'none';

    const btn = document.getElementById('btn-action');
    btn.style.display = 'block';
    btn.textContent   = 'Voir la réponse';
    btn.className     = 'btn-action green';
}

function handleClick() {
    const aEl  = document.getElementById('a-text');
    const btn  = document.getElementById('btn-action');
    const isLast = currentIdx >= shuffledQ.length - 1;

    if (aEl.style.display === 'none') {
        // Révéler la réponse
        aEl.style.display = 'flex';
        document.getElementById('progress-bar').style.width =
            `${((currentIdx + 1) / shuffledQ.length) * 100}%`;

        if (!isLast) {
            btn.textContent = 'Question suivante';
            btn.className   = 'btn-action purple';
        } else {
            btn.textContent = 'Fin du thème';
            btn.className   = 'btn-action dark';
        }
    } else {
        if (!isLast) {
            currentIdx++;
            showQuestion();
        } else {
            // Fin de catégorie — reset visuel
            document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
            document.getElementById('q-cat-label').textContent = 'Sélectionnez un thème';
            document.getElementById('q-counter').textContent   = '';
            document.getElementById('progress-bar').style.width = '0%';
            const qEl = document.getElementById('q-text');
            if (qEl) {
                qEl.closest('.q-inner').innerHTML = '<p class="q-placeholder" id="q-text">👈 Sélectionnez une catégorie pour commencer.</p>';
            } else {
                document.querySelector('.q-inner').innerHTML = '<p class="q-placeholder" id="q-text">👈 Sélectionnez une catégorie pour commencer.</p>';
            }
            aEl.style.display = 'none';
            btn.style.display = 'none';
            currentCat = null;
        }
    }
}

function resetApp() {
    document.getElementById('screen-game').style.display = 'none';
    document.getElementById('screen-game').classList.remove('active');
    document.getElementById('screen-public').style.display = 'flex';
    currentCat = null;
}
</script>
