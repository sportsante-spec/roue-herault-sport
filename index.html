<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>JEU DE ROUE SPORT SANTÉ</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --herault-magenta: #8D1F5B; --text-dark: #2d3436; --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--herault-magenta); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: white; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 90px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 10; flex-shrink: 0; }
        .logo-img { height: 60px; width: auto; }
        .header-center { text-align: center; }
        .header-center h1 { margin: 0; font-size: 1.1rem; color: var(--herault-magenta); font-weight: 900; }
        main { display: flex; flex: 1; padding: 20px; gap: 20px; box-sizing: border-box; height: calc(100vh - 90px); overflow: hidden; }
        .sidebar { flex: 1; display: flex; flex-direction: column; justify-content: space-between; background: rgba(255, 255, 255, 0.1); border-radius: 25px; padding: 15px; box-sizing: border-box; }
        #list-items { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .cat-item { background: white; border-radius: 15px; padding: 10px 15px; display: flex; align-items: center; cursor: pointer; transition: var(--transition); }
        .cat-item:active { transform: scale(0.95); }
        .circle { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-right: 12px; flex-shrink: 0; color: white; }
        .cat-item h3 { margin: 0; font-size: 0.85rem; font-weight: 700; color: var(--text-dark); }
        .content-area { flex: 2; background: white; border-radius: 35px; padding: 30px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .q-box { background: #f8f9fa; border-radius: 25px; padding: 20px; font-size: 1.2rem; font-weight: 800; text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; color: var(--herault-magenta); overflow-y: auto; }
        .a-box { display: none; background: #fdf2f5; padding: 20px; border-radius: 20px; border-left: 8px solid var(--herault-magenta); font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; text-align: center; }
        .btn-reveal { background: #2ecc71; color: white; border: none; padding: 20px; border-radius: 15px; font-weight: 900; cursor: pointer; font-size: 1.2rem; }
        .btn-reset { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 700; width: 100%; margin-top: 10px; }
        
        .color-vert { background-color: #27ae60; } 
        .color-bleu { background-color: #2980b9; } 
        .color-jaune { background-color: #f1c40f; }
        .color-orange { background-color: #e67e22; }
        .color-rouge { background-color: #c0392b; }
        .color-violet { background-color: #9b59b6; }

        #step-public { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 20px; width: 280px; }
        .btn-public { background: white; color: var(--herault-magenta); border: none; padding: 30px; border-radius: 20px; font-weight: 900; font-size: 1.4rem; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<header>
    <img src="logo-herault.png" alt="Logo" class="logo-img">
    <div class="header-center"><h1>Sport Santé Bien Être</h1><p>Espace éducateur</p></div>
    <img src="logo-departement.png" alt="Logo" class="logo-img">
</header>

<main>
    <div id="step-public">
        <button class="btn-public" onclick="startApp('adulte')">ADO / ADULTE</button>
        <button class="btn-public" onclick="startApp('enfant')">ENFANT</button>
    </div>

    <div id="game-interface" style="display:none; width: 100%; gap: 20px; flex: 1;">
        <div class="sidebar">
            <div id="list-items"></div>
            <button class="btn-reset" onclick="resetApp()">← CHANGER PUBLIC</button>
        </div>
        <div class="content-area">
            <div id="q-label" style="color: var(--herault-magenta); font-weight: 900; margin-bottom: 10px; font-size: 0.8rem;">SÉLECTIONNEZ UN THÈME</div>
            <div id="q-text" class="q-box">Prêt pour le quiz ?</div>
            <div id="a-text" class="a-box"></div>
            <button id="btn-reveal" class="btn-reveal" style="display: none;" onclick="handleButtonClick()">VOIR LA RÉPONSE</button>
        </div>
    </div>
</main>

<script>
    const data = {
        'adulte': [
            {e: '🌍', n: 'Environnement', c: 'color-vert', questions: [{q: "Questions Adulte Environnement à venir...", r: "..."}]},
            {e: '👤', n: 'Mon corps', c: 'color-rouge', questions: [{q: "Questions Adulte Mon corps à venir...", r: "..."}]},
            {e: '⚽', n: 'Sport', c: 'color-bleu', questions: [{q: "Questions Adulte Sport à venir...", r: "..."}]},
            {e: '🍎', n: 'Alimentation', c: 'color-jaune', questions: [{q: "Questions Adulte Alimentation à venir...", r: "..."}]},
            {e: '🌬️', n: 'Respiration', c: 'color-violet', questions: [{q: "Questions Adulte Respiration à venir...", r: "..."}]},
            {e: '📱', n: 'Écrans', c: 'color-orange', questions: [{q: "Questions Adulte Écrans à venir...", r: "..."}]}
        ],
        'enfant': [
            {
                e: '🌍', n: 'Environnement', c: 'color-vert',
                questions: [
                    {q: "Protéger l'environnement, c'est important parce que :\nA. La Terre est trop grande\nB. On n'y vit qu'un moment\nC. On vit dessus et on en a besoin\nD. Les animaux vivent ailleurs", r: "Réponse C : On vit dessus et on en a besoin"},
                    {q: "L'air, l'eau et la terre sont :\nA. Inutiles\nB. Seulement pour les animaux\nC. Essentiels pour la vie\nD. Remplaçables", r: "Réponse C : Essentiels pour la vie"},
                    {q: "Trier les déchets permet de :\nA. Les faire disparaître\nB. Les recycler et moins polluer\nC. Les mélanger\nD. Les brûler", r: "Réponse B : Les recycler et moins polluer"},
                    {q: "Jeter un déchet dans la nature peut :\nA. Ne rien faire\nB. Aider les plantes\nC. Polluer l'environnement\nD. Le faire disparaître", r: "Réponse C : Polluer l'environnement"},
                    {q: "Pour économiser l'eau, on peut :\nA. Laisser couler le robinet\nB. Prendre des douches très longues\nC. Fermer le robinet quand on se lave les mains\nD. Arroser souvent", r: "Réponse C : Fermer le robinet"}
                ]
            },
            {
                e: '👤', n: 'Mon corps', c: 'color-rouge',
                questions: [
                    {q: "Pourquoi est-il important de prendre soin de son cœur dès l'enfance ?\nA. Il ne sert qu'aux adultes\nB. Il travaille toute la vie\nC. Il grandit chaque jour\nD. Il peut s'arrêter la nuit", r: "Réponse B : Il travaille toute la vie"},
                    {q: "Bouger tous les jours permet surtout de :\nA. Fatiguer le cœur\nB. Aider le cœur à rester en bonne santé\nC. Abîmer les muscles\nD. Donner plus faim", r: "Réponse B : Aider le cœur à rester en bonne santé"},
                    {q: "Le cœur bat plus vite quand :\nA. On dort\nB. On fait un effort physique\nC. On regarde la télé\nD. On lit un livre", r: "Réponse B : On fait un effort physique"}
                ]
            },
            {
                e: '⚽', n: 'Sport', c: 'color-bleu',
                questions: [
                    {q: "Le sport aide le cœur car :\nA. Il le fait travailler et rester fort\nB. Il le fatigue pour toujours\nC. Il le ralentit\nD. Il ne change rien", r: "Réponse A : Il le fait travailler et rester fort"},
                    {q: "Il est important de s'échauffer avant le sport pour :\nA. Faire joli\nB. Prévenir les blessures\nC. Se fatiguer plus vite\nD. Ne rien changer", r: "Réponse B : Prévenir les blessures"}
                ]
            },
            {
                e: '🍎', n: 'Alimentation', c: 'color-jaune',
                questions: [
                    {q: "Manger équilibré signifie :\nA. Manger toujours la même chose\nB. Manger un peu de tout\nC. Manger seulement des légumes\nD. Manger beaucoup", r: "Réponse B : Manger un peu de tout"},
                    {q: "L'eau est la seule boisson :\nA. Sucrée\nB. Indispensable au corps\nC. Interdite\nD. Inutile", r: "Réponse B : Indispensable au corps"}
                ]
            },
            {
                e: '🌬️', n: 'Respiration', c: 'color-violet',
                questions: [
                    {q: "La respiration sert surtout à :\nA. Faire bouger les muscles\nB. Apporter de l'oxygène au corps\nC. Digérer les aliments\nD. Donner de la chaleur", r: "Réponse B : Apporter de l'oxygène au corps"},
                    {q: "Le sang transporte dans le corps :\nA. Seulement de l'eau\nB. De l'oxygène et des nutriments\nC. Des os\nD. Des microbes", r: "Réponse B : De l'oxygène et des nutriments"}
                ]
            },
            {
                e: '📱', n: 'Écrans', c: 'color-orange',
                questions: [{q: "Questions Enfants Écrans à venir...", r: "..."}]
            }
        ]
    };

    let currentCat = null;
    let currentIdx = 0;

    function startApp(p) {
        document.getElementById('step-public').style.display = 'none';
        document.getElementById('game-interface').style.display = 'flex';
        const list = document.getElementById('list-items');
        list.innerHTML = '';
        data[p].forEach(item => {
            const div = document.createElement('div');
            div.className = 'cat-item';
            div.onclick = () => selectCategory(item);
            div.innerHTML = `<div class="circle ${item.c}">${item.e}</div><h3>${item.n}</h3>`;
            list.appendChild(div);
        });
    }

    function selectCategory(cat) {
        currentCat = cat;
        currentIdx = 0;
        showQuestion();
    }

    function showQuestion() {
        const item = currentCat.questions[currentIdx];
        document.getElementById('q-label').innerText = currentCat.n.toUpperCase() + " (" + (currentIdx + 1) + "/" + currentCat.questions.length + ")";
        document.getElementById('q-text').innerText = item.q;
        document.getElementById('a-text').innerText = item.r;
        document.getElementById('a-text').style.display = 'none';
        const btn = document.getElementById('btn-reveal');
        btn.style.display = 'block';
        btn.innerText = "VOIR LA RÉPONSE";
        btn.style.background = "#2ecc71";
    }

    function handleButtonClick() {
        const ans = document.getElementById('a-text');
        const btn = document.getElementById('btn-reveal');
        
        if (ans.style.display === 'none') {
            ans.style.display = 'block';
            if (currentIdx < currentCat.questions.length - 1) {
                btn.innerText = "QUESTION SUIVANTE";
                btn.style.background = var(--herault-magenta);
            } else {
                btn.innerText = "FIN DU THÈME";
                btn.style.background = "#34495e";
            }
        } else {
            if (currentIdx < currentCat.questions.length - 1) {
                currentIdx++;
                showQuestion();
            } else {
                resetApp();
            }
        }
    }

    function resetApp() {
        document.getElementById('game-interface').style.display = 'none';
        document.getElementById('step-public').style.display = 'flex';
        document.getElementById('q-text').innerText = "Prêt pour le quiz ?";
        document.getElementById('a-text').style.display = 'none';
        document.getElementById('btn-reveal').style.display = 'none';
        document.getElementById('q-label').innerText = "SÉLECTIONNEZ UN THÈME";
    }
</script>
</body>
</html>
